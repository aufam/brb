#:schema https://raw.githubusercontent.com/aufam/carton/main/carton-schema.json

[package]
edition = 20
version = "0.3.0"
name = "brb"

[[bin]]
name = "main"
path = "src/main.cpp"
required-features = ["cpx", "static_files", "gzip", "brotli", "zstd", "multipart"]

[[bin]]
name = "test"
path = "tests/"
required-features = ["gtest", "date", "multipart"]

[dependencies]
boost = { version = "1.92.0", features = ["url"] }
version = { src = ["src/version/version.cpp"], flags = ['-DBRB_VERSION=\"{version}\"'] }

xxhash = { version = "0.8.3", optional = true }
zlib = { version = "1.3.2", optional = true }
cpx = { version = "0.2.0", features = ["cli", "fmt"], optional = true }
gtest = { version = "1.17.0", optional = true }

date = {
    mod = ["src/extras/date/lib.cppm"],
    src = ["src/extras/date/*.cpp"],
    optional = true
}

multipart = {
    mod = ["src/extras/multipart/lib.cppm"],
    src = ["src/extras/multipart/*.cpp"],
    optional = true
}

static_files = {
    mod = ["src/middlewares/static_files/lib.cppm"],
    src = ["src/middlewares/static_files/*.cpp"],
    features = ["xxhash", "date"],
    optional = true
}
gzip = {
    mod = ["src/middlewares/gzip/lib.cppm"],
    src = ["src/middlewares/gzip/*.cpp"],
    features = ["zlib"],
    optional = true
}
brotli = {
    version = "1.2.0",
    mod = ["src/middlewares/brotli/lib.cppm"],
    src = ["src/middlewares/brotli/*.cpp"],
    optional = true
}
zstd = {
    version = "1.5.7",
    mod = ["src/middlewares/zstd/lib.cppm"],
    src = ["src/middlewares/zstd/*.cpp"],
    optional = true
}
